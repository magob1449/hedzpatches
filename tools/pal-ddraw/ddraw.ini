; =====================================================================
; pal-ddraw / ddraw.ini - H.E.D.Z.
; ---------------------------------------------------------------------
; WHERE THIS FILE GOES
;   Put it in C:\GAMES\HEDZ\ next to the pal-ddraw ddraw.dll.
;   pal-ddraw derives the path itself: it takes its own module filename
;   and swaps the extension for ".ini", so the file must be named
;   ddraw.ini (lower case is fine on Windows).
;
; IMPORTANT - READ BEFORE EDITING
;   This file previously shipped with invented key names (Windowed,
;   Resolution, VSync, Emulate8BitPalettedSurface, ...). NONE of those
;   exist in pal-ddraw. They were an earlier authoring mistake and have
;   been removed. Do not reintroduce them.
;
;   The ONLY configuration keys present in the deployed
;   pal-ddraw ddraw.dll (verified by reading its string table) are:
;
;       NoBuffer
;       UseFlip
;       UseThrottle
;       BPP
;
;   plus the literal "PAL-DDRAW" (program/section identifier) and the
;   log file name "fddraw.log". The build does not import the Windows
;   profile API (GetPrivateProfileIntA/StringA are both absent), so it
;   parses its ini with its own code - which also means there is no
;   documented list of accepted values to copy from this file.
;
;   => Every key below is COMMENTED OUT on purpose. That is not an
;      oversight: the game was verified to reach its front-end menu with
;      NO ddraw.ini present at all, so the built-in defaults are known
;      good. Only uncomment a key if you have a specific reason and have
;      confirmed the effect, because guessing values here is exactly the
;      kind of change that causes a wrapper to stop presenting frames.
;
; VERIFYING WHAT IT ACTUALLY DID
;   With logging active pal-ddraw writes fddraw.log into the process
;   working directory (normally the game folder). That log is the
;   authoritative record of which DirectDraw calls it intercepted. If
;   fddraw.log is absent, pal-ddraw's logging path never ran.
;
; =====================================================================

[PAL-DDRAW]
; All four keys exist in this build. Semantics must be confirmed against
; pal-ddraw's own documentation before use - do not guess.

; NoBuffer     - related to whether a back buffer is created/used.
;                A game that expects flipping may need this off.
; NoBuffer=0

; UseFlip      - whether page-flip emulation is used instead of blitting
;                the back buffer to the front buffer. HEDZ flips
;                (see the "Blt of back buffer to front buffer failed."
;                and flip-related strings in Hedz.exe).
; UseFlip=1

; UseThrottle  - frame-rate throttling. Leaning on this can smooth out
;                flip timing on fast modern CPUs but adds latency.
; UseThrottle=1

; BPP          - colour depth the wrapper presents. HEDZ renders 8-bit
;                paletted internally; the wrapper presents 32-bit to
;                Windows 11.
; BPP=32
